<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FisioConnectPro - Login</title>
  <!-- Usando CDN Tailwind para visual rápido sem build extra -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen font-sans">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border border-slate-200">
    <div class="flex justify-center mb-6">
      <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center font-bold text-4xl text-white shadow-md">
        F
      </div>
    </div>
    
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">FisioConnectPro</h2>
    <p class="text-center text-sm text-slate-500 mb-6">Acesso ao sistema de fisioterapia</p>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
        <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="dr@clinica.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
      </div>
      
      <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 text-rose-600 text-xs px-3 py-2 rounded-md">
        <span id="errorMessage"></span>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center disabled:opacity-70 disabled:cursor-not-allowed">
        Entrar
      </button>
    </form>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Verificando...';
      errorBox.classList.add('hidden');

      // Chama processo principal para fazer o login
      const result = await ipcRenderer.invoke('attempt-login', { email, password });

      if (result.success) {
        submitBtn.innerText = 'Acesso Liberado!';
        submitBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
        // main.js the window will be closed automatically
      } else {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Entrar';
        errorMessage.innerText = result.error;
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
